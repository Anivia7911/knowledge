server:
  port: 8082
spring:
  application:
    name: file-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    username: postgres
    password: 123456
    url: jdbc:postgresql://192.168.10.146:5432/postgres
    driver-class-name: org.postgresql.Driver
  cloud:
    nacos:
      config:
        enabled: false
        refresh-enabled: false
        file-extension: yaml
        server-addr: 192.168.10.146:8848
      discovery:
        enabled: false
        instance-enabled: false
        server-addr: 192.168.10.146:8848
  config:
    import:
      - optional:nacos:file-service.yaml
  data:
    redis:
      host: localhost
      port: 6379
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0